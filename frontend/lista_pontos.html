<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLab - Lista de Pontos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/lista.css">
    <script src="js/lista_pontos.js"></script>
</head>

<body>

    <nav>
        <div class="logo">
            <span></span>
            <img src="./assets/logo-zap.png" alt="logo principal" width="25" height="25">
            Leitor
            <span>SPDA</span>
        </div>
        <div class="usuario">
            <span id="user-name">Equipe 1</span>
            <div class="usuario-avatar">
                <img src="./assets/images-index/iconUsuario.png" alt="icone usuário" width="45" height="45">
            </div>
        </div>
    </nav>

    <main class="principal">
        <div class="titulo">
            <h1>Lista de Pontos Cadastrados</h1>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <a href="cadastro_ponto.html" class="btn-voltar"
                    style="background: var(--primary-color); color: var(--branco);">+ Cadastrar</a>
                <a href="painel_gestor.html" class="btn-voltar">
                    <img src="./assets/images-cadastro-pt/move-left.png" alt="icone de seta" width="20" height="20">
                    Voltar
                </a>
            </div>
        </div>

        <div class="filtros-container">
            <div class="grupo-filtro">
                <label for="filtro-busca">Buscar por Código / Local</label>
                <input type="text" id="filtro-busca" placeholder="Ex: RZ-SPDA-TQ-CI-001">
            </div>
            <div class="grupo-filtro">
                <label for="filtro-area">Área</label>
                <select id="filtro-area">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="grupo-filtro">
                <label for="filtro-tipo">Tipo de Ponto</label>
                <select id="filtro-tipo">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="grupo-filtro">
                <label for="filtro-status">Status</label>
                <select id="filtro-status">
                    <option value="">Todos</option>
                    <option value="conforme">Conforme</option>
                    <option value="nao-conforme">Não Conforme</option>
                </select>
            </div>
            <button class="btn-filtrar" onclick="aplicarFiltros()">Filtrar</button>
        </div>

        <div class="grid-pontos" id="grid-pontos">

        </div>
    </main>

</body>
