<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo Morto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/config.css">
    <script src="./js/seguranca.js"></script>
</head>
<body>
    <nav>
        <div class="logo">
            <span></span> 
            <img src="./assets/logo-zap.png" alt="logo principal" width="25" height="25">
            Leitor 
            <span>SPDA</span>
        </div>
        <div class="usuario">
            <span id="user-name">Equipe 1</span>
            <div class="usuario-avatar">
                <img src="./assets/images-index/iconUsuario.png" alt="icone usuário" width="45" height="45">
            </div>
        </div>
    </nav>

    <main class="principal">
        <div class="titulo">
            <h1>Arquivo Morto (Inativos)</h1>
            <a href="painel_gestor.html" class="btn-voltar">
                <img src="./assets/images-cadastro-pt/move-left.png" alt="icone de seta" width="20" height="20">
                Voltar
            </a>
        </div>
        <div class="formulario">
            <div class="tab-cntd">
                <div class="tabs-nav">
                    <button class="tab-btn active" data-tab="tab-clientes-inativos">Clientes Inativos</button>
                    <button class="tab-btn" data-tab="tab-unidades-inativas">Unidades Inativas</button>
                    <button class="tab-btn" data-tab="tab-areas-inativas">Áreas Inativas</button>
                    <button class="tab-btn" data-tab="tab-tipos-inativos">Tipos de Ponto Inativos</button>
                </div>

                <!-- Aba Clientes -->
                <div id="tab-clientes-inativos" class="tab-ctt active">
                    <div class="lista-itens" style="margin-top: 10px;">
                        <h3 style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Estes clientes foram inativados. Restaure-os clicando em Reativar.</h3>
                        <div id="clientes-inativos-render"></div>
                    </div>
                </div>

                <!-- Aba Unidades -->
                <div id="tab-unidades-inativas" class="tab-ctt">
                    <div class="lista-itens" style="margin-top: 10px;">
                        <h3 style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Unidades inativadas (Dica: Se a unidade foi inativada por causa do cliente, reative o cliente primeiro).</h3>
                        <div id="unidades-inativas-render"></div>
                    </div>
                </div>

                <!-- Aba Áreas -->
                <div id="tab-areas-inativas" class="tab-ctt">
                    <div class="lista-itens" style="margin-top: 10px;">
                        <h3 style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Áreas inativadas.</h3>
                        <div id="areas-inativas-render"></div>
                    </div>
                </div>

                <!-- Aba Tipos -->
                <div id="tab-tipos-inativos" class="tab-ctt">
                    <div class="lista-itens" style="margin-top: 10px;">
                        <h3 style="color: #666; font-size: 0.9rem; margin-bottom: 15px;">Tipos de Ponto inativados.</h3>
                        <div id="tipos-inativos-render"></div>
                    </div>
                </div>
            </div>

            <div id="mensagem-feedback-inativos"></div>
        </div>

    </main>

    <script>
       document.addEventListener('DOMContentLoaded', () => {
    // Lógica das Abas (Tabs)
    const tabButtons = document.querySelectorAll('.tab-btn');
    const tabContents = document.querySelectorAll('.tab-ctt');

    tabButtons.forEach(button => {
        button.addEventListener('click', () => {
            tabButtons.forEach(btn => btn.classList.remove('active'));
            tabContents.forEach(content => content.classList.remove('active'));
            button.classList.add('active');
            document.getElementById(button.getAttribute('data-tab')).classList.add('active');
        });
    });

    const msgFeedback = document.getElementById('mensagem-feedback-inativos');

    function mostrarFeedback(msg) {
        msgFeedback.innerText = msg;
        msgFeedback.style.color = "#28a745";
        msgFeedback.style.fontWeight = "bold";
        msgFeedback.style.padding = "10px";
        setTimeout(() => { msgFeedback.innerText = ""; }, 3000);
    }

    // ================= CLIENTES =================
    const renderInativosCli = document.getElementById('clientes-inativos-render');
    async function carregarClientesInativos() {
        const res = await fetch('http://localhost:3000/api/clientes/inativos');
        const clientes = await res.json();
        renderInativosCli.innerHTML = clientes.length ? '' : '<p>Lixeira vazia.</p>';
        
        clientes.forEach(c => {
            const div = document.createElement('div');
            div.className = "card-inativo";
            div.innerHTML = `
                <div><strong style="text-decoration: line-through;">${c.nome}</strong> (${c.sigla})</div>
                <button onclick="reativarCliente(${c.id})" class="btn-reativar">♻️ Reativar</button>
            `;
            renderInativosCli.appendChild(div);
        });
    }

    window.reativarCliente = async function(id) {
        if(!confirm("Deseja reativar este cliente?")) return;
        const res = await fetch(`http://localhost:3000/api/clientes/${id}/reativar`, { method: 'PUT' });
        if(res.ok) { mostrarFeedback("Cliente restaurado!"); carregarClientesInativos(); }
    };

    // ================= UNIDADES =================
    const renderInativosUni = document.getElementById('unidades-inativas-render');
    async function carregarUnidadesInativas() {
        const res = await fetch('http://localhost:3000/api/unidades/inativos');
        const unidades = await res.json();
        renderInativosUni.innerHTML = unidades.length ? '' : '<p>Lixeira vazia.</p>';
        
        unidades.forEach(u => {
            const div = document.createElement('div');
            div.className = "card-inativo";
            div.innerHTML = `
                <div><strong style="text-decoration: line-through;">${u.nome}</strong></div>
                <button onclick="reativarUnidade(${u.id})" class="btn-reativar">♻️ Reativar</button>
            `;
            renderInativosUni.appendChild(div);
        });
    }

    window.reativarUnidade = async function(id) {
        if(!confirm("Deseja reativar esta unidade?")) return;
        const res = await fetch(`http://localhost:3000/api/unidades/${id}/reativar`, { method: 'PUT' });
        if(res.ok) { mostrarFeedback("Unidade restaurada!"); carregarUnidadesInativas(); }
    };

    // ================= ÁREAS =================
    const renderInativosArea = document.getElementById('areas-inativas-render');
    async function carregarAreasInativas() {
        const res = await fetch('http://localhost:3000/api/areas/inativos');
        const areas = await res.json();
        renderInativosArea.innerHTML = areas.length ? '' : '<p>Lixeira vazia.</p>';
        
        areas.forEach(a => {
            const div = document.createElement('div');
            div.className = "card-inativo";
            div.innerHTML = `
                <div><strong style="text-decoration: line-through;">${a.nome}</strong> (${a.sigla})</div>
                <button onclick="reativarArea(${a.id})" class="btn-reativar">♻️ Reativar</button>
            `;
            renderInativosArea.appendChild(div);
        });
    }

    window.reativarArea = async function(id) {
        if(!confirm("Deseja reativar esta área?")) return;
        const res = await fetch(`http://localhost:3000/api/areas/${id}/reativar`, { method: 'PUT' });
        if(res.ok) { mostrarFeedback("Área restaurada!"); carregarAreasInativas(); }
    };

    // ================= TIPOS =================
    const renderInativosTipo = document.getElementById('tipos-inativos-render');
    async function carregarTiposInativos() {
        const res = await fetch('http://localhost:3000/api/tipos/inativos');
        const tipos = await res.json();
        renderInativosTipo.innerHTML = tipos.length ? '' : '<p>Lixeira vazia.</p>';
        
        tipos.forEach(t => {
            const div = document.createElement('div');
            div.className = "card-inativo";
            div.innerHTML = `
                <div><strong style="text-decoration: line-through;">${t.nome}</strong></div>
                <button onclick="reativarTipo(${t.id})" class="btn-reativar">♻️ Reativar</button>
            `;
            renderInativosTipo.appendChild(div);
        });
    }

    window.reativarTipo = async function(id) {
        if(!confirm("Deseja reativar este tipo?")) return;
        const res = await fetch(`http://localhost:3000/api/tipos/${id}/reativar`, { method: 'PUT' });
        if(res.ok) { mostrarFeedback("Tipo restaurado!"); carregarTiposInativos(); }
    };

    // Inicializa carregando todas as lixeiras
    carregarClientesInativos();
    carregarUnidadesInativas();
    carregarAreasInativas();
    carregarTiposInativos();
});

    </script>
</body>
</html>
