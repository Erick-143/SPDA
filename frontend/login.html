<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema SPDA</title>
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <!-- 1. Importa a inteligência de Login do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <script src="./js/seguranca.js"></script>
</head>

<body>
    <nav>
        <div class="logo">
            <span></span>
            <img src="./assets/logo-zap.png" alt="logo principal" width="25" height="25">
            Leitor
            <span>SPDA</span>
        </div>
    </nav>

    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem;">

        <div class="cadastro" style="width: 100%; max-width: 400px; padding: 4rem 2rem; text-align: center;">
            <h2 class="ind-titulo" style="margin-bottom: 1.5rem;">Acesso Restrito</h2>

            <p style="margin-bottom: 2.5rem; color: #666; font-size: 0.95rem; line-height: 1.5;">
                Faça login utilizando a sua conta Google corporativa autorizada para acessar o painel.
            </p>

            <!-- 2. A Mágica do Google: Este código vai renderizar o botão automaticamente! -->


            <!-- Formulário Tradicional -->
            <form id="form-login" style="margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1rem;">
                <input type="email" id="email-login" placeholder="Seu e-mail" required
                    style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
                <input type="password" id="senha-login" placeholder="Sua senha" required
                    style="padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem;">
                <button type="submit"
                    style="width: 100%; padding: 12px; border-radius: 8px; background-color: #333; color: white; border: none; font-weight: bold; cursor: pointer; font-size: 1rem;">Entrar</button>
            </form>

            <a href="criar_senha.html"
                style="display: block; margin-bottom: 2rem; color: #555; text-decoration: underline; font-size: 0.9rem;">Gestor
                ou Inspetor: Primeiro acesso? Crie sua senha aqui</a>

            <div style="margin-bottom: 1.5rem; color: #666; font-size: 0.9rem;">
                Ou entre diretamente com sua conta Google:
            </div>

            <!-- ATENÇÃO: COLE SEU CLIENT ID ABAIXO -->
            <div id="g_id_onload"
                data-client_id="629604508013-83t8kmdlt1gq798k92nrgdtlmm9e2g7t.apps.googleusercontent.com"
                data-callback="tratarRespostaDoGoogle" data-auto_prompt="false">
            </div>

            <!-- Estilo do botão (Aqui você pode mudar o "theme" para "filled_blue" ou "outline") -->
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"
                style="display: flex; justify-content: center;">
            </div>

            <p id="msg-erro" class="login-msg-erro" style="margin-top: 20px;">E-mail não autorizado.</p>
        </div>

    </main>

    <script>
        // Função necessária para "descriptografar" o crachá virtual que o Google nos envia
        function decodificarJwt(token) {
            const base64Url = token.split('.')[1];
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            const payload = decodeURIComponent(atob(base64).split('').map(function (c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(payload);
        }


        async function tratarRespostaDoGoogle(response) {
            const dadosDoGoogle = decodificarJwt(response.credential);
                    const msgErro = document.getElementById('msg-erro');

            try {
                // Pergunta para a nossa API enviando o TOKEN SEGURO do Google
                const res = await fetch('http://localhost:3000/api/auth/login-google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: response.credential })
                });


                // Se o banco responder com sucesso (Status 200)
                if (res.ok) {
                    const usuarioBanco = await res.json(); // Pega a resposta do banco

                    // Salva os dados verdadeiros vindos do banco
                    localStorage.setItem('usuario_id', usuarioBanco.id);
                    localStorage.setItem('perfil', usuarioBanco.perfil);

                    // Salva nome e foto estéticos vindos do Google
                    localStorage.setItem('nomeUsuario', dadosDoGoogle.name);
                    localStorage.setItem('fotoPerfil', dadosDoGoogle.picture);

                    // Redireciona com base no perfil do BANCO DE DADOS
                    if (usuarioBanco.perfil.toLowerCase() === 'gestor') {
                        window.location.href = 'painel_gestor.html';
                    } else {
                        window.location.href = 'leitura.html';
                    }
                           } 
                // Se o banco responder que não existe (Ex: Status 401)
                else {
                    // Pegamos a resposta de erro exata enviada pelo nosso Backend (authController)
                    const erroJson = await res.json(); 
                    
                    // Mostra a mensagem do erro (Ou um texto padrão caso o erroJson venha vazio)
                    msgErro.innerText = erroJson.erro || "Este e-mail não possui acesso ao sistema.";
                    msgErro.style.display = "block";
                }
            } catch (error) {
                console.error("Erro ao conectar na API:", error);
                msgErro.innerText = "Erro de conexão com o servidor.";
                msgErro.style.display = "block";
            }

        }
        document.getElementById('form-login').addEventListener('submit', async function (e) {
            e.preventDefault(); // Impede a página de recarregar
            const email = document.getElementById('email-login').value;
            const senha = document.getElementById('senha-login').value;
            const msgErro = document.getElementById('msg-erro');

            try {
                // Envia para a nossa rota tradicional que usa o bcryptjs
                const res = await fetch('http://localhost:3000/api/auth/login-tradicional', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senhaDigitada: senha })
                });

                if (res.ok) {
                    const usuarioBanco = await res.json();

                    localStorage.setItem('usuario_id', usuarioBanco.id);
                    localStorage.setItem('perfil', usuarioBanco.perfil);
                    localStorage.setItem('nomeUsuario', usuarioBanco.nome);

                    if (usuarioBanco.perfil.toLowerCase() === 'gestor') {
                        window.location.href = 'painel_gestor.html';
                    } else {
                        window.location.href = 'leitura.html';
                    }
                } else {
                    const erroJson = await res.json();
                    msgErro.innerText = erroJson.erro || "Falha no login.";
                    msgErro.style.display = "block";
                }
            } catch (error) {
                console.error("Erro na API:", error);
                msgErro.innerText = "Erro de conexão com o servidor.";
                msgErro.style.display = "block";
            }
        });

    </script>
</body>

</html>
